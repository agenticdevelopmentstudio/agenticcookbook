- id: cookbook-validate
  name: cookr validate
  description: Read-only Phase A checks + index drift detection on a cookbook directory.
  entry: cookr validate
  language: system
  pass_filenames: false
  always_run: true
  types: [markdown]

- id: cookbook-lint
  name: cookr lint --no-llm
  description: Deterministic lint checks (no LLM pass). Same Phase A rules as validate.
  entry: cookr lint --no-llm
  language: system
  pass_filenames: false
  always_run: true
  types: [markdown]
